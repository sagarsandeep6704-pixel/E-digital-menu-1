<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b8420f">
<title>Karachi Karahl House – Menu</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2a1608;--muted:#7a5a3c;--brand:#b8420f;--gold:#f5a623;--wa:#128c4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:28px 18px 22px;text-align:center}
header h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:.3px}
header p{margin:8px 0 0;font-size:18px;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:var(--gold);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;background:#fff;color:var(--brand);text-decoration:none;font-weight:700;font-size:17px;padding:10px 16px;border-radius:999px}
main{padding:8px 14px 40px;max-width:640px;margin:0 auto}
h2{font-size:28px;color:var(--brand);margin:30px 4px 12px;border-bottom:3px solid var(--gold);padding-bottom:6px}
.item{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(90,40,0,.12);display:flex;align-items:center;gap:12px}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:21px}
.price{color:var(--muted);font-size:20px;margin-top:2px}
.btn{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:18px;min-height:52px;padding:0 16px;border-radius:14px}
.btn:active{filter:brightness(.9)}
.btn svg{width:22px;height:22px;fill:#fff}
footer{text-align:center;color:var(--muted);font-size:16px;padding:0 16px 40px}
@media(max-width:360px){.btn span{display:none}.btn{padding:0 14px}}
</style>
</head>
<body>
<header>
  <h1>Karachi Karahl House</h1>
  <p>Tap Order to send your choice on WhatsApp</p>
</header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer>Prices in ₹ · Karachi Karahl House</footer>

<script>
// Change the number here. WhatsApp links normally need the country code (e.g. 91 for India).
var PHONE = "9166004130";

var MENU = [
 ["Breakfast",[
  ["Puri Sabji",140],["Butter Toast with Jam (4 Pcs)",75],["Chicken Sandwich",175],["Veg Sandwich",140],
  ["Plain Omelet",90],["Masala Omelet",120],["Boiled Egg",85],["Egg Bhurji",125]]],
 ["Rice & Biryani",[
  ["Steam Rice",259],["Jeera Rice",345],["Veg Polau",299],["Chicken Polau",368],
  ["Peas Polau",350],["Curd Rice",210],["Chicken Biryani",353],["Mutton Biryani",230]]],
 ["Tandoor Bahaar",[
  ["Chicken Tikka Kabab",120],["Chicken Tangri Kabab",165],["Chicken Reshmi Kabab",185],["Fish Tikka Kabab",220],
  ["Tandoori Chicken Full",175],["Tandoori Chicken Half",175],["Paneer Tikka Kabab",300],["Tandoori Potato",375]]],
 ["Indian Veg & Non Veg",[
  ["Yellow Dal Fry",125],["Mixed Veg",220],["Paneer Butter Masala",275],["Paneer Do Pyaza",295],
  ["Kadhai Paneer",260],["Aloo Gobi Masala",170],["Chicken Masala Dish",270],["Chicken Curry (4 pcs)",225],
  ["Chicken Kasha (4 pcs)",225],["Kadhai Chicken (4 pcs)",242],["Chicken Bhara",259],["Chicken Masala",230],
  ["Ruhu Fish Fry (2)",213],["Ruhu Fish Curry",230],["Egg Curry",138],["Egg Masala",156],
  ["Bhetki Masala",345],["Mutton Kasha (3 pcs)",330],["Mutton Rogan Josh (3 pcs)",350],["Prawn Masala",460]]],
 ["Indian Breads",[
  ["Chapati",29],["Butter Roti",35],["Aloo Paratha",105],["Laccha Paratha",90],["Plain Paratha",80],["Masala Kulcha",150]]],
 ["Bangali Ranna",[
  ["Aloo Bhaja",125],["Shukta",230],["Cholar Dal",150],["Luchi (4 pcs, Maida)",125],["Begun Bhaja (2 pcs)",90],["Veg Khichuri",150]]]
];

var WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200zm4.5-6.100c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.100l-.8 1c-.1.200-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.900c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200c0 1.300.9 2.500 1 2.700.1.200 1.800 2.800 4.400 3.900 1.600.7 2.200.7 3 .6.500-.1 1.500-.6 1.700-1.200.2-.6.200-1.100.2-1.200-.1-.1-.2-.2-.5-.3z"/></svg>';

function link(dish){
  return "https://wa.me/" + PHONE + "?text=" + encodeURIComponent("I want to order " + dish);
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

var nav="", html="";
MENU.forEach(function(sec){
  var id=slug(sec[0]);
  nav+='<a href="#'+id+'">'+esc(sec[0])+'</a>';
  html+='<section id="'+id+'"><h2>'+esc(sec[0])+'</h2>';
  sec[1].forEach(function(d){
    html+='<div class="item"><div class="info"><div class="name">'+esc(d[0])+'</div><div class="price">₹'+d[1]+'</div></div>'+
          '<a class="btn" target="_blank" rel="noopener" href="'+esc(link(d[0]))+'" aria-label="Order '+esc(d[0])+' on WhatsApp">'+WA_ICON+'<span>Order</span></a></div>';
  });
  html+='</section>';
});
document.getElementById("nav").innerHTML=nav;
document.getElementById("menu").innerHTML=html;
</script>
</body>
</html>
